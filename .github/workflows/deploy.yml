name: Deploy to DigitalOcean (Server)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            # Detect server directory
            if [ -d "$HOME/projects/school/school-server" ]; then
              cd "$HOME/projects/school/school-server"
            elif [ -d "$HOME/school-server" ]; then
              cd "$HOME/school-server"
            elif [ -d "/var/www/school-server" ]; then
              cd "/var/www/school-server"
            else
              echo "School server directory not found!"
              exit 1
            fi

            echo "Deploying server to $(pwd)..."

            # Pull the latest changes from Git
            git reset --hard
            git pull origin main

            # Install dependencies
            npm install

            # Compile TypeScript code
            npm run build

            # Restart the process in PM2 and reload environment variables
            pm2 restart school-server --update-env || pm2 restart all || pm2 start dist/server.js --name "school-server"
