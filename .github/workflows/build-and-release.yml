name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release name (e.g., v1.0.0)'
        required: false
        default: 'Latest Build'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v2
      with:
        api-level: 34
        ndk-version: 24.0.8215888
    
    - name: Navigate to Android directory
      run: cd android
    
    - name: Make Gradle executable
      run: chmod +x android/gradlew
    
    - name: Build Debug APK
      run: cd android && ./gradlew assembleDebug
    
    - name: Build Release APK
      run: cd android && ./gradlew assembleRelease
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
    
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release.apk
        path: android/app/build/outputs/apk/release/app-release.apk
    
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/create-release@v1.1.4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: ${{ github.event.inputs.release_name }} - Build ${{ github.run_number }}
        body: |
          ## New Release
          - Debug APK: Download from artifacts
          - Release APK: Download from artifacts
          - Commit: ${{ github.sha }}
          - Build: ${{ github.run_id }}
        draft: false
        prerelease: false
    
    - name: Upload Release APK to Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-release-asset@v1.0.2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: android/app/build/outputs/apk/release/app-release.apk
        asset_name: SchoolApp-v${{ github.run_number }}.apk
        asset_content_type: application/vnd.android.package-archive

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install dependencies (Server)
      run: cd server && npm install
    
    - name: Build Server
      run: cd server && npm run build
    
    - name: Deploy to Heroku (Server)
      env:
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      run: |
        cd server
        git remote add heroku https://git.heroku.com/school-server.git
        git push heroku main
    
    - name: Install dependencies (Client)
      run: cd client && npm install
    
    - name: Build Client
      run: cd client && npm run build
    
    - name: Deploy to Heroku (Client)
      env:
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      run: |
        cd client
        git remote add heroku https://git.heroku.com/school-client.git
        git push heroku main
