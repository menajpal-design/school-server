name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release name (e.g., v1.0.0)'
        required: false
        default: 'Latest Build'

# Allow the workflow to create releases and upload artifacts
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Navigate to Android directory
      run: cd android
    
    - name: Make Gradle executable
      run: chmod +x android/gradlew
    
    - name: Build Debug APK
      run: cd android && ./gradlew assembleDebug

    - name: Setup signing keystore (if provided)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        set -e
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "Decoding keystore and writing key.properties"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/my-release-key.jks
          echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "storeFile=app/my-release-key.jks" >> android/key.properties
        else
          echo "No KEYSTORE_BASE64 provided; skipping keystore setup"
        fi
    
    - name: Build Release APK
      run: cd android && ./gradlew assembleRelease
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
    
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release.apk
        # allow any APK produced in the release output dir (handles -unsigned or different names)
        path: android/app/build/outputs/apk/release/*.apk
    
    - name: Find Release APK
      id: find_apk
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

    - name: Create Release
      id: create_release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/create-release@v1.1.4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: ${{ github.event.inputs.release_name }} - Build ${{ github.run_number }}
        body: |
          ## New Release
          - Debug APK: Download from artifacts
          - Release APK: Download from artifacts
          - Commit: ${{ github.sha }}
          - Build: ${{ github.run_id }}
        draft: false
        prerelease: false
    
    - name: Upload Release APK to Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-release-asset@v1.0.2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.find_apk.outputs.apk_path }}
        asset_name: SchoolApp-v${{ github.run_number }}.apk
        asset_content_type: application/vnd.android.package-archive
